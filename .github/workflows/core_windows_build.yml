name: Windows Build (MSVC)

on:
  push:
    branches: [ master, united, devel ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, united, devel ]
    # A pull request that touches only documentation does not need a build; the
    # Codestyle workflow still runs on every pull request, so a status always exists.
    # Pushes (master, tags) are never filtered: the nightly and the releases depend on them.
    paths-ignore:
      - '**.md'
      - 'extra/doc/**'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: windows-2022
    timeout-minutes: 120
    concurrency:
      group: windows-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
      sha256: ${{ steps.package.outputs.sha256 }}

    env:
      BUILD_DIR: ${{ github.workspace }}\..\build-msvc
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 1
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CCACHE_DEPEND: 1
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Setup MSVC environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'no Visual Studio installation carrying the C++ x64 toolset was found' }
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }

          $before = @{}
          foreach ($item in Get-ChildItem Env:) { $before[$item.Name] = $item.Value }

          $captured = @{}
          $output = & "$env:ComSpec" /s /c "`"$vcvars`" && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed with exit code $LASTEXITCODE" }
          foreach ($line in $output) {
            if ($line -notmatch '^([A-Za-z_][A-Za-z0-9_()]*)=(.*)$') { continue }
            $name = $matches[1]
            $value = $matches[2]
            if ($before[$name] -ne $value) { $captured[$name] = $value }
          }

          foreach ($required in 'VCToolsRedistDir', 'INCLUDE', 'LIB') {
            if (-not $captured.ContainsKey($required)) { throw "vcvars64.bat did not set $required" }
          }
          $toolset = ($captured['Path'] -split ';' | Where-Object { $_ -and (Test-Path (Join-Path $_ 'link.exe')) } | Select-Object -First 1)
          if (-not $toolset) { throw 'link.exe is not on the environment vcvars64.bat produced' }

          foreach ($name in $captured.Keys | Sort-Object) {
            Add-Content -Path $env:GITHUB_ENV -Value "$name=$($captured[$name])"
          }
          Write-Host "MSVC $($captured['VCToolsVersion']) from $install"
          Write-Host "link.exe from $toolset"

      - name: Install ccache 4.14
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          curl.exe --fail --location --retry 3 --output $zip https://github.com/ccache/ccache/releases/download/v4.14/ccache-4.14-windows-x86_64.zip
          if ($LASTEXITCODE -ne 0) { throw "ccache download failed with exit code $LASTEXITCODE" }
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne '2568347a697e103ca1b073981c704ad76fb2507d066c38dba038dd73399d968f') { throw "ccache checksum mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $dir = Join-Path $env:RUNNER_TEMP 'ccache-4.14-windows-x86_64'
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          & (Join-Path $dir 'ccache.exe') --version | Select-Object -First 1

      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}\.ccache
          key: windows-msvc-ccache-${{ github.sha }}
          restore-keys: windows-msvc-ccache-

      - name: Reset compiler cache statistics
        shell: bash
        run: ccache --zero-stats > /dev/null

      - name: Compute version
        id: version
        shell: bash
        run: |
          sha7=${GITHUB_SHA::7}
          default_branch='${{ github.event.repository.default_branch }}'
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/tags/*) version="$GITHUB_REF_NAME" ;;
            pull_request:*)   version="pr${{ github.event.pull_request.number }}-g$sha7" ;;
            push:refs/heads/*)
              if [ "$GITHUB_REF_NAME" = "$default_branch" ]; then
                version="nightly-$(date -u +%Y%m%d)-g$sha7"
              else
                version="${GITHUB_REF_NAME//\//-}-g$sha7"
              fi ;;
            *)                version="${GITHUB_REF_NAME//\//-}-g$sha7" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=MangosThree-$version-win64" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Configure
        shell: pwsh
        run: |
          $arguments = @(
            '-S', '.', '-B', $env:BUILD_DIR, '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_C_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Z7',
            '-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Z7',
            '-DCMAKE_EXE_LINKER_FLAGS_RELEASE=/DEBUG /INCREMENTAL:NO /OPT:REF /OPT:ICF',
            '-DCMAKE_SHARED_LINKER_FLAGS_RELEASE=/DEBUG /INCREMENTAL:NO /OPT:REF /OPT:ICF',
            "-DCMAKE_INSTALL_PREFIX=$env:BUILD_DIR/install",
            '-DCMAKE_C_COMPILER_LAUNCHER=ccache',
            '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache',
            '-DBUILD_TOOLS=1',
            '-DBUILD_MANGOSD=1',
            '-DBUILD_REALMD=1',
            '-DWITH_TESTS=1',
            '-DWITH_CRYPTO_TESTS=1',
            '-DWITH_NET_TESTS=0',
            '-DSCRIPT_LIB_SD3=1',
            '-DPCH=1'
          )
          cmake @arguments
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed with exit code $LASTEXITCODE" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build $env:BUILD_DIR --parallel
          if ($LASTEXITCODE -ne 0) { throw "build failed with exit code $LASTEXITCODE" }

      - name: Compiler cache statistics
        if: always()
        shell: bash
        env:
          EXACT_RESTORE: ${{ steps.ccache-restore.outputs.cache-hit }}
        run: |
          ccache --show-config | grep -iE 'cache_dir|max_size|sloppiness|compiler_check|direct_mode|depend_mode' || true
          ccache --show-stats --verbose
          {
            echo '### ccache (this build)'
            echo '```'
            ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXACT_RESTORE" = "true" ]; then
            direct=$(ccache --print-stats | awk -F'\t' '$1 == "direct_cache_hit" {print $2}')
            pre=$(ccache --print-stats | awk -F'\t' '$1 == "preprocessed_cache_hit" {print $2}')
            miss=$(ccache --print-stats | awk -F'\t' '$1 == "cache_miss" {print $2}')
            total=$(( ${direct:-0} + ${pre:-0} + ${miss:-0} ))
            if [ "$total" -gt 0 ] && [ $(( ${direct:-0} * 100 / total )) -lt 50 ]; then
              echo "::warning::ccache direct-hit rate below 50% on an exact cache restore (direct=${direct:-0} preprocessed=${pre:-0} miss=${miss:-0}) -- the cache may be broken"
            fi
          fi

      - name: Save compiler cache
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}\.ccache
          key: windows-msvc-ccache-${{ github.sha }}

      - name: Test
        shell: bash
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure

      # The assembly tier of the Montgomery kernel must be the one that ran here (see the
      # Linux workflow); the ml64-assembled twin is what this job exercises.
      - name: Check the assembly tier ran
        shell: bash
        run: |
          out=$("$BUILD_DIR/src/tests/mangos_tests.exe" -only CryptoMontgomery_assembly_tier)
          echo "$out"
          echo "$out" | grep -q "tier: asm"

      - name: Install
        shell: bash
        run: cmake --install "$BUILD_DIR"

      - name: Package
        id: package
        shell: pwsh
        run: >
          ./.github/apps/ci/package-windows.ps1
          -InstallDir "$env:BUILD_DIR\install"
          -BuildDir "$env:BUILD_DIR"
          -Version "${{ steps.version.outputs.version }}"
          -OutDir "$env:RUNNER_TEMP\pkg"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

      - name: Verify the working tree is clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the build modified the source tree"
            git status --porcelain
            exit 1
          fi

  nightly:
    name: Publish nightly
    needs: build
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: nightly-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Publish rolling nightly release
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.build.outputs.version }}'
          zip=MangosThree-nightly-win64.zip
          mv "dist/MangosThree-$version-win64.zip" "dist/$zip"
          sha=$(sha256sum "dist/$zip" | cut -d' ' -f1)
          sha7=${GITHUB_SHA::7}
          images="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mangosthree"
          stamp=$(date -u '+%Y-%m-%d %H:%M UTC')
          branch='${{ github.event.repository.default_branch }}'

          current=$(gh api "repos/$GH_REPO/git/ref/tags/nightly" --jq .object.sha 2>/dev/null) || current=""
          [[ "$current" =~ ^[0-9a-f]{40}$ ]] || current=""
          if [ -n "$current" ]; then
            status=$(gh api "repos/$GH_REPO/compare/$current...$GITHUB_SHA" --jq .status)
            case "$status" in
              ahead|identical) ;;
              *) echo "::notice::nightly already points at ${current::7} ($status of this commit); nothing to do"; exit 0 ;;
            esac
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" > /dev/null
          fi

          cat > body.md <<BODY
          Rolling build of \`$branch\` at [\`$sha7\`](https://github.com/$GH_REPO/commit/$GITHUB_SHA) — $stamp. Replaced on every successful \`$branch\` build; the download URL never changes.

          | Asset | SHA-256 |
          |---|---|
          | \`$zip\` | \`$sha\` |

          **Docker images for this commit** (present once its Docker workflow has finished): \`$images-mangosd:sha-$sha7\`, \`$images-realmd:sha-$sha7\`. The \`:nightly\` tags follow the latest successful \`$branch\` Docker build independently of this zip.

          **Windows:** extract, copy \`mangosd.conf.dist\` to \`mangosd.conf\` and \`realmd.conf.dist\` to \`realmd.conf\`, set the \`*DatabaseInfo\` lines, run \`realmd.exe\` and \`mangosd.exe\`. No Visual C++ redistributable needed; crash logs (with symbols) land in the Crashes folder.
          BODY

          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --prerelease --latest=false --title "Nightly build" --notes-file body.md
            gh release upload nightly "dist/$zip" --clobber
          else
            gh release create nightly --prerelease --latest=false --title "Nightly build" --notes-file body.md "dist/$zip"
          fi
          echo "Published nightly for $sha7"

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          zip="dist/MangosThree-$tag-win64.zip"
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          version="${tag#v}"
          images="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mangosthree"

          prev=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null) || prev=""
          [[ "$prev" =~ ^v[0-9] ]] || prev=""
          prerelease=false; case "$tag" in *-*) prerelease=true ;; esac
          latest=false
          if [ "$prerelease" = false ]; then
            if [ -z "$prev" ] || [ "$(printf '%s\n' "$prev" "$tag" | sort -V | tail -n1)" = "$tag" ]; then
              latest=true
            fi
          fi

          args=(-f tag_name="$tag")
          [ -n "$prev" ] && args+=(-f previous_tag_name="$prev")
          gh api -X POST "repos/$GH_REPO/releases/generate-notes" "${args[@]}" --jq .body > notes.md
          extra=""
          [ "$latest" = true ] && extra=' (also `:latest`)'
          cat >> notes.md <<NOTES

          | Asset | SHA-256 |
          |---|---|
          | \`MangosThree-$tag-win64.zip\` | \`$sha\` |

          Docker images: \`$images-mangosd:$version\`, \`$images-realmd:$version\`$extra
          NOTES

          flags=(--verify-tag --title "MangosThree $tag" --notes-file notes.md "--latest=$latest")
          [ "$prerelease" = true ] && flags+=(--prerelease)
          if gh release view "$tag" > /dev/null 2>&1; then
            target=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::release $tag exists for ${target::7}, not for ${GITHUB_SHA::7}"; exit 1
            fi
            gh release upload "$tag" "$zip" --clobber
            editflags=(--title "MangosThree $tag" --notes-file notes.md "--latest=$latest")
            [ "$prerelease" = true ] && editflags+=(--prerelease)
            gh release edit "$tag" "${editflags[@]}"
            echo "Refreshed existing release $tag"
          else
            gh release create "$tag" "${flags[@]}" "$zip"
            echo "Published $tag (latest=$latest, prerelease=$prerelease)"
          fi
