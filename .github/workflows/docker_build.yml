name: Docker Build

on:
  push:
    branches: [ master, united, devel ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, united, devel ]
    # A pull request that touches only documentation does not need a build; the
    # Codestyle workflow still runs on every pull request, so a status always exists.
    # Pushes (master, tags) are never filtered: the nightly and the releases depend on them.
    paths-ignore:
      - '**.md'
      - 'extra/doc/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  DOCKER_METADATA_SHORT_SHA_LENGTH: 7

jobs:
  build:
    name: Build and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      CACHE_TO: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,scope=server,mode=max' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "mangosd=$REGISTRY/$owner/mangosthree-mangosd" >> "$GITHUB_OUTPUT"
          echo "realmd=$REGISTRY/$owner/mangosthree-realmd" >> "$GITHUB_OUTPUT"

      - name: Decide mutable version tags
        id: guard
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          is_latest=false; minor_latest=false
          case "$tag" in
            *-*) ;;
            *)
              latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null) || latest=""
              [[ "$latest" =~ ^v[0-9] ]] || latest=""
              if [ -z "$latest" ] || [ "$(printf '%s\n' "$latest" "$tag" | sort -V | tail -n1)" = "$tag" ]; then
                is_latest=true
              fi
              prefix="${tag%.*}."
              top=$( { gh release list --exclude-pre-releases --exclude-drafts --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null || true; echo "$tag"; } \
                     | grep -F "$prefix" | sort -V | tail -n1 )
              [ "$top" = "$tag" ] && minor_latest=true
              ;;
          esac
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"
          echo "minor_latest=$minor_latest" >> "$GITHUB_OUTPUT"
          echo "latest=$is_latest minor=$minor_latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags for mangosd
        id: meta-mangosd
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ steps.names.outputs.mangosd }}
          flavor: latest=false
          tags: |
            type=raw,value=nightly,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.guard.outputs.minor_latest == 'true' }}
            type=raw,value=latest,enable=${{ steps.guard.outputs.is_latest == 'true' }}

      - name: Tags for realmd
        id: meta-realmd
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ steps.names.outputs.realmd }}
          flavor: latest=false
          tags: |
            type=raw,value=nightly,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.guard.outputs.minor_latest == 'true' }}
            type=raw,value=latest,enable=${{ steps.guard.outputs.is_latest == 'true' }}

      - name: Build mangosd image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: extra/docker/Dockerfile
          target: mangosd
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: false
          tags: ${{ steps.meta-mangosd.outputs.tags }}
          labels: ${{ steps.meta-mangosd.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: ${{ env.CACHE_TO }}

      - name: Build realmd image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: extra/docker/Dockerfile
          target: realmd
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: false
          tags: ${{ steps.meta-realmd.outputs.tags }}
          labels: ${{ steps.meta-realmd.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: ${{ env.CACHE_TO }}

      - name: Smoke-test images
        env:
          MANGOSD_IMAGE: ${{ fromJSON(steps.meta-mangosd.outputs.json).tags[0] }}
          REALMD_IMAGE: ${{ fromJSON(steps.meta-realmd.outputs.json).tags[0] }}
          PUSHED: ${{ github.event_name != 'pull_request' }}
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          check() {
            image=$1
            daemon=$2
            echo "== $image: $daemon --version"

            if [ "$PUSHED" = true ]; then
              docker pull --quiet "$image" > /dev/null
            fi

            revision=$(docker image inspect "$image" \
                       --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            # On a pull request the checkout is the synthetic merge commit (github.sha)
            # while the PR's own head is what the operator recognises; the image
            # carries whichever the metadata action labelled it with. Either is
            # this PR; anything else is a stale or foreign image.
            if [ "$revision" != "$EXPECTED_REVISION" ] && [ "$revision" != "$GITHUB_SHA" ]; then
              echo "::error::$image was built from '$revision', expected $EXPECTED_REVISION (or the merge commit $GITHUB_SHA)"
              exit 1
            fi

            if ! out=$(docker run --rm "$image" "$daemon" --version 2>&1); then
              echo "$out"
              echo "::error::$daemon failed to start from $image"
              exit 1
            fi
            echo "$out"

            version=$(printf '%s' "$out" | tail -n 1 | tr -d '\r')
            case "$version" in
              *[0-9].[0-9]*.[0-9]*" ("*")") ;;
              *)
                echo "::error::$daemon --version ended with '$version', not a release and a revision"
                exit 1 ;;
            esac
          }
          check "$MANGOSD_IMAGE" mangosd
          check "$REALMD_IMAGE" realmd
